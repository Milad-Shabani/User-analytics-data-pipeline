[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-pipeline"
version = "1.0.0"
description = "A production-shaped ETL pipeline joining a user-profile dimension (CSV) with incremental event streams (JSON) into a Parquet + warehouse fact table."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
