name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          flake8 src tests --max-line-length=100 --extend-ignore=E203
          black --check src tests

      - name: Run tests
        run: pytest -v --cov=analytics_pipeline --cov-report=term-missing

      - name: Smoke test the CLI against bundled sample data
        run: python -m analytics_pipeline.cli run
