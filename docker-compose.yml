# Zero-setup mode: `docker compose up pipeline` runs the pipeline against the
# bundled sample data using SQLite — no other services required.
#
# To try it against a real SQL Server target instead, uncomment the `sqlserver`
# service below and set DB_BACKEND=mssql (see .env.example).
services:
  pipeline:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - DB_BACKEND=${DB_BACKEND:-sqlite}
      - SQLITE_PATH=/app/data/processed/warehouse.db

